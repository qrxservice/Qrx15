kind = "web"
previewPath = "/"
title = "QRX"
version = "1.0.0"
id = "artifacts/rxmanager"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25108

[services.development]
run = "pnpm --filter @workspace/rxmanager run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rxmanager", "run", "build" ]
publicDir = "artifacts/rxmanager/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25108"
BASE_PATH = "/"
